# Simulated spot settings (account: paper_spot.py, bot: spot_bot.py, Alpaca copy: alpaca_mirror.py).
# Spot trades the same weekly coins (state/futures_universe.json) and the same signals as the futures
# accounts, but buy-only and without leverage, so the two can be compared directly.

# Strategies, each in its own simulated account (state/spot_<name>.json): ma_crossover, breakout, momentum.
strategies = ["ma_crossover", "breakout", "momentum"]

# Dollars per buy. A sell signal or stop sells that coin's whole position.
trade_usd = 500

# Each position is sold if the price falls this far below the buy price (0.08 = 8%).
stop_pct = 0.08

# Starting cash of each simulated account, in USD. Only used when an account is first created.
starting_balance = 10000

# Fee on every simulated fill (0.0025 = 0.25%, Alpaca's base crypto taker fee).
fee = 0.0025

# Copy trades in coins Alpaca lists to the Alpaca paper account (with real stop orders there).
alpaca_mirror = true
