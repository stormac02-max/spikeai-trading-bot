name: MA crossover bot (crypto)

on:
  schedule:
    # Every day at 00:15 UTC (5:15 AM PKT), just after Alpaca's daily crypto candle closes at 00:00 UTC.
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check the signals without placing orders)"
        type: boolean
        default: true

permissions:
  contents: write # to commit the log back to the repository

concurrency:
  group: trading-bot # shared with the stock workflow so their log commits never collide
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crypto bot
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          CRYPTO_BOT_LOG: logs/crypto_bot.log
          TZ: Asia/Karachi # log timestamps in Pakistan time
          BOT_ARGS: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python crypto_bot.py $BOT_ARGS

      - name: Save log to the repository
        if: always()
        run: |
          if [ ! -f logs/crypto_bot.log ]; then
            echo "The bot did not write a log this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/crypto_bot.log
          if git diff --cached --quiet; then
            echo "No log changes to save."
            exit 0
          fi
          git commit -m "Crypto bot log $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
