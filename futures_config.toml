# Simulated futures settings (account: paper_futures.py, bot: futures_bot.py, backtest: backtest_futures.py).

# Which coins to trade: every Monday at 00:00 UTC (5:00 AM PKT, 7:00 PM ET Sunday), the
# `universe_size` most-traded Hyperliquid perps by volume over the past 7 days, minus `universe_exclude`.
# Hyperliquid quotes memecoins worth fractions of a cent per 1,000 coins with a "k" prefix (kPEPE, kBONK).
universe_size = 20
universe_exclude = ["BTC", "ETH"]

# Strategies paper traded side by side, each in its own simulated account (state/futures_<name>.json),
# using the same signal code as the backtest. Choose from: ma_crossover, breakout, momentum.
strategies = ["ma_crossover", "breakout", "momentum"]

# After this date, compare the accounts (return and worst drawdown) and keep the best strategy.
evaluation_until = 2026-12-27

# Leverage for every trade, capped at each coin's exchange maximum. 2x had the best risk-adjusted
# backtest results; 5x lost money with every strategy.
leverage = 2

# Each position closes automatically if the price moves this far against it (0.08 = 8%).
stop_pct = 0.08

# Margin put up per trade, in USDC. Position size = margin x leverage.
margin_usd = 500

# Starting balance of each simulated account, in USDC. Only used when an account is first created.
starting_balance = 10000

# Hyperliquid's base taker fee (0.045%), charged on every simulated fill.
taker_fee = 0.00045
